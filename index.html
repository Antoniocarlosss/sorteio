<title>Rifa da Beleza — Sorteio Premiado</title>
<style>
:root{color-scheme:light;--cream:#fff6e5;--gold:#e1b760;--green:#0b3628;--dark:#052219}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#fffaf0,#eddbc0);color:var(--green);font:15px system-ui,sans-serif}button,select{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e9ac43;outline-offset:4px}button:disabled,select:disabled{opacity:.55;cursor:default}button{transition:transform .16s,background .2s,box-shadow .2s}button:active:not(:disabled){transform:scale(.96)}button:hover:not(:disabled){box-shadow:0 0 19px #ffe09765}header{text-align:center;padding:24px 12px 20px;border-top:5px solid #b98831}header svg{width:70px;height:43px;vertical-align:middle}header h1{font:bold clamp(32px,6vw,73px)/1 Georgia,serif;margin:8px 0 13px;letter-spacing:-.035em}header p,.eyebrow{margin:0;font-weight:750;letter-spacing:.2em;font-size:10px}header p{color:#80591e}.ornament{display:flex;align-items:center;justify-content:center;gap:14px}.ornament:before,.ornament:after{content:'';height:1px;width:min(18vw,130px);background:linear-gradient(90deg,transparent,#b98831)}.ornament:after{transform:scaleX(-1)}
main{width:min(1100px,calc(100% - 28px));margin:0 auto 24px;border:1px solid #a87532;border-radius:25px;overflow:hidden;background:radial-gradient(ellipse at 35% 27%,#175d43,var(--dark) 64%);color:var(--cream);box-shadow:0 16px 50px #37270d40}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:13px 22px;background:#041d16aa;border-bottom:1px solid #d8ad5659}.bar .eyebrow{color:#f9dc9a}.bar .eyebrow:before{content:'◆';margin-right:9px;color:#edbc63}.tools{display:flex;gap:7px;flex-wrap:wrap}.ghost{border:1px solid #bd985d78;border-radius:8px;background:#0b3126;color:#ffebc4;padding:9px 12px;font-size:11px;font-weight:750;letter-spacing:.04em}.stage{display:grid;grid-template-columns:1.35fr 1fr;align-items:center;gap:clamp(18px,5vw,62px);padding:28px clamp(14px,5vw,65px) 22px}.wheelbox{position:relative;width:min(100%,480px);margin:auto;aspect-ratio:1;filter:drop-shadow(0 18px 13px #0009)}#wheel{width:100%;height:100%;display:block}.pointer{position:absolute;top:-3%;left:50%;width:10%;transform:translateX(-50%);filter:drop-shadow(0 4px 3px #211302aa)}.count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:bold clamp(52px,11vw,135px) Georgia;color:#fff2bb;background:#042418a8;border-radius:50%;text-shadow:0 0 30px #ffd36c}.count[hidden]{display:none}.count.pop{animation:pop .55s both}@keyframes pop{from{opacity:.25;scale:1.12}to{opacity:1;scale:1}}
.prize{background:#fff3de;color:var(--green);border:1px solid #edc16a;border-radius:16px;overflow:hidden;box-shadow:0 10px 34px #0005}.prize img{display:block;width:100%;aspect-ratio:1.65;object-fit:cover}.prize div{padding:13px 16px}.prize .eyebrow{color:#80551c}.prize h2{font:bold clamp(20px,3vw,30px) Georgia;margin:5px 0 0}.setup{margin-top:14px}.setup label{display:block;color:#ffdfa0;margin:0 0 7px}.selectors{display:flex;gap:7px}.selectors select{min-width:0;border:1px solid #bc965d;border-radius:8px;background:#07291f;color:#fff0ce;padding:9px;font-size:12px}.selectors select:first-child{flex:1}.notice{font-size:11px;font-weight:700;color:#ffdb84;min-height:17px;margin:7px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.primary{flex:1;border:1px solid #ffebac;border-radius:9px;background:linear-gradient(175deg,#fff2ba,#e0ad50 65%,#be842c);color:#292007;padding:12px 14px;font-weight:900;letter-spacing:.07em;box-shadow:0 4px 0 #80561f}.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #80561f}.board{margin:0 clamp(14px,5vw,65px) 25px;padding:15px;border-radius:15px;border:1px solid #b48a4b7f;background:#031b14c9}.boardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}.boardhead h2{font:bold 17px Georgia;margin:0}.boardhead span{font-size:11px;color:#f9d793;text-align:right}.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}.cell{display:grid;place-items:center;min-height:30px;border:1px solid #b38b4e88;border-radius:5px;background:linear-gradient(#164734,#0b2e24);font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(11px,2vw,17px);color:#f9eacb}.cell.active{background:linear-gradient(#fff2b4,#dba84c);color:#201605;border-color:#ffeab6;box-shadow:0 0 13px #ffcb55a0;animation:pulse .25s ease-out}.cell.win{box-shadow:0 0 20px #ffe49f;animation:pulse .8s ease-in-out infinite alternate}@keyframes pulse{from{scale:.93}to{scale:1}}footer{text-align:center;color:#6f5228;font-size:10px;letter-spacing:.15em;padding:0 10px 19px}
dialog{max-width:none;max-height:none;width:100%;height:100%;margin:0;padding:16px;border:0;background:transparent;color:#fff2c4;overflow:auto}dialog[open]{display:grid;place-items:center}dialog::backdrop{background:#010f0be9;animation:fade .75s both}@keyframes fade{from{opacity:0}to{opacity:1}}#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.reveal{position:relative;text-align:center;perspective:650px;padding:20px}.reveal h2{font:800 clamp(14px,3vw,28px) system-ui;letter-spacing:.12em;margin:0;color:#ffe4a3}.reveal p{margin:14px 0 0;color:#fff6db}.winner{display:block;font:bold clamp(110px,30vw,285px)/.95 Georgia;background:linear-gradient(#fff9d4 15%,#e8b757 37%,#fff2a8 49%,#b37622 69%,#ffde8c 88%);background-clip:text;color:transparent;filter:drop-shadow(0 8px 1px #714411) drop-shadow(0 0 35px #ffc85869);animation:arrive .95s cubic-bezier(.12,.72,.2,1) both;margin:8px 0 24px}@keyframes arrive{from{transform:translateZ(-460px) rotateX(-28deg);opacity:0}to{transform:translateZ(0) rotateX(0);opacity:1}}.revealing main,.revealing header{filter:brightness(.43);transition:filter .8s}
@media(max-width:650px){.stage{grid-template-columns:1fr;gap:16px}.wheelbox{width:min(100%,400px)}.prize{display:grid;grid-template-columns:1fr 1fr;align-items:center}.bar{padding:10px 13px}.board{padding:9px}.grid{gap:3px}.cell{min-height:27px}}@media(prefers-reduced-motion:reduce){*,*::backdrop{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
